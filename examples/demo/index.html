<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>iv-player demo</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0 auto;
        padding: 24px 16px 48px;
        max-width: 960px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 1.5rem;
      }
      p {
        margin: 0 0 16px;
        opacity: 0.75;
      }
      .controls {
        display: flex;
        gap: 8px;
        margin: 12px 0 20px;
      }
      .controls button {
        font: inherit;
        padding: 6px 14px;
        border-radius: 6px;
        border: 1px solid currentColor;
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
      /* Taller than 16:9 on purpose, so 16:9 and 4:3 clips both show letterboxing. */
      iv-player {
        --iv-aspect-ratio: 3 / 2;
        border-radius: 12px;
      }
      .custom-theme iv-player {
        --iv-accent: #ffcc00;
        --iv-accent-contrast: #1a1a1a;
        --iv-overlay-background: rgb(20 10 40 / 0.75);
        --iv-hotspot-border: 3px dashed #ffcc00;
        --iv-font: 600 1.05rem/1.4 Georgia, serif;
      }
      .custom-theme iv-player::part(option) {
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      h2 {
        font-size: 1rem;
        margin: 0 0 8px;
      }
      #log {
        margin: 0;
        padding: 0;
        list-style: none;
        font-size: 0.875rem;
        max-height: 240px;
        overflow: auto;
      }
      #log li {
        padding: 4px 0;
        border-bottom: 1px solid rgb(128 128 128 / 0.25);
      }
      #log time {
        opacity: 0.6;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <h1>iv-player demo</h1>
    <p>Haz clic en la puerta antes del segundo 6 o espera la pregunta del segundo 7.</p>

    <iv-player>
      <span slot="start">▶ Empezar</span>
    </iv-player>

    <div class="controls">
      <button id="restart" type="button">Reiniciar</button>
      <button id="theme" type="button">Cambiar tema</button>
    </div>

    <h2>Eventos</h2>
    <ol id="log"></ol>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
