name: Release

# Publishes both packages to npm when a GitHub release is published. npm trusts
# this workflow through trusted publishing (OIDC), so there's no npm token, and
# each version gets a provenance attestation linking it to this commit.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Lets npm verify this workflow and sign the provenance attestation.
      id-token: write
    steps:
      - name: Check out the release
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Update npm
        run: npm install --global npm@^11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      # check:size builds both packages and declarations before measuring them.
      - name: Build and check bundle size
        run: pnpm check:size

      - name: Check package exports
        run: pnpm check:exports

      - name: Publish
        run: node scripts/publish.mjs --tag "$TAG"
        env:
          TAG: ${{ github.event.release.tag_name }}
